<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#FFFAF0"/>
      <stop offset="100%" stop-color="#FBE6C8"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="shell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF1DE"/>
    </linearGradient>
  </defs>

  <!-- zemin -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- geri sayım halkası: tepeden saat yönünde 280 derece -->
  <path d="M 256 66 A 190 190 0 1 1 68.9 223.0"
        fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round"/>

  <!-- halka boşluğunda küçülen nokta izleri (geri sayım hissi) -->
  <circle cx="175.7" cy="83.8" r="13" fill="#FFCC80"/>
  <circle cx="121.7" cy="121.7" r="10" fill="#FFD79B"/>
  <circle cx="83.8"  cy="175.7" r="7"  fill="#FFE3B8"/>

  <!-- halkanın ucunda kırmızı zaman noktası -->
  <circle cx="68.9" cy="223.0" r="23" fill="#E53935"/>

  <!-- yumurta gölgesi -->
  <ellipse cx="256" cy="404" rx="88" ry="15" fill="#E3CBA4" opacity="0.55"/>

  <!-- yumurta karakteri (hafif yatık) -->
  <g transform="rotate(-6 256 270)">
    <path d="M 256,140
             C 190,140 160,230 160,290
             C 160,360 205,396 256,396
             C 307,396 352,360 352,290
             C 352,230 322,140 256,140 Z"
          fill="url(#shell)" stroke="#EFD9BC" stroke-width="4"/>
    <!-- parlama -->
    <ellipse cx="215" cy="205" rx="26" ry="40" fill="#FFFFFF" opacity="0.65" transform="rotate(-18 215 205)"/>
    <!-- gözler -->
    <ellipse cx="224" cy="278" rx="9" ry="13" fill="#4E342E"/>
    <ellipse cx="288" cy="278" rx="9" ry="13" fill="#4E342E"/>
    <!-- gülümseme -->
    <path d="M 238 306 Q 256 322 274 306" fill="none" stroke="#4E342E" stroke-width="7" stroke-linecap="round"/>
    <!-- yanaklar -->
    <ellipse cx="200" cy="303" rx="15" ry="9" fill="#FFCC80" opacity="0.9"/>
    <ellipse cx="312" cy="303" rx="15" ry="9" fill="#FFCC80" opacity="0.9"/>
  </g>
</svg>
