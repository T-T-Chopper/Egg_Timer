<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFAF1"/>
      <stop offset="100%" stop-color="#FCE4C0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="shell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF1DE"/>
    </linearGradient>
  </defs>

  <!-- zemin -->
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- yumuşak dekor daireleri -->
  <circle cx="985" cy="60"  r="130" fill="#FFDFAE" opacity="0.35"/>
  <circle cx="40"  cy="470" r="150" fill="#FFE8C4" opacity="0.5"/>
  <circle cx="620" cy="-40" r="110" fill="#FFEAC8" opacity="0.45"/>

  <!-- sol üstte küçük geri sayım noktaları (ikon ile aynı dil) -->
  <circle cx="84"  cy="72" r="9"  fill="#FFCC80"/>
  <circle cx="114" cy="60" r="7"  fill="#FFD79B"/>
  <circle cx="140" cy="52" r="5"  fill="#FFE3B8"/>

  <!-- başlık -->
  <text x="80" y="196" font-family="DejaVu Sans" font-weight="bold" font-size="92" fill="#3E2723">Egg Timer</text>
  <text x="84" y="254" font-family="DejaVu Sans" font-size="36" fill="#6D4C41">Yumurta Zamanlayıcısı</text>

  <!-- pişkinlik rozetleri (uygulamadaki kartların yankısı) -->
  <g font-family="DejaVu Sans" font-weight="bold" font-size="23" fill="#5D4037">
    <rect x="80"  y="300" width="182" height="54" rx="27" fill="#FFFFFF" stroke="#FFA726" stroke-width="3"/>
    <text x="171" y="335" text-anchor="middle">Rafadan 5&#8242;</text>

    <rect x="282" y="300" width="164" height="54" rx="27" fill="#FFFFFF" stroke="#FFA726" stroke-width="3"/>
    <text x="364" y="335" text-anchor="middle">Kayısı 7&#8242;</text>

    <rect x="466" y="300" width="146" height="54" rx="27" fill="#FFFFFF" stroke="#FFA726" stroke-width="3"/>
    <text x="539" y="335" text-anchor="middle">Sert 10&#8242;</text>
  </g>

  <!-- alt slogan -->
  <text x="84" y="408" font-family="DejaVu Sans" font-size="26" fill="#8D6E63">Tam kıvamında, her seferinde.</text>

  <!-- sağda yumurta karakteri + halka (ikonla aynı motif) -->
  <g transform="translate(806,250) scale(0.72) translate(-256,-256)">
    <path d="M 256 66 A 190 190 0 1 1 68.9 223.0"
          fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round"/>
    <circle cx="175.7" cy="83.8" r="13" fill="#FFCC80"/>
    <circle cx="121.7" cy="121.7" r="10" fill="#FFD79B"/>
    <circle cx="83.8"  cy="175.7" r="7"  fill="#FFE3B8"/>
    <circle cx="68.9" cy="223.0" r="23" fill="#E53935"/>
    <ellipse cx="256" cy="404" rx="88" ry="15" fill="#E3CBA4" opacity="0.55"/>
    <g transform="rotate(-6 256 270)">
      <path d="M 256,140
               C 190,140 160,230 160,290
               C 160,360 205,396 256,396
               C 307,396 352,360 352,290
               C 352,230 322,140 256,140 Z"
            fill="url(#shell)" stroke="#EFD9BC" stroke-width="4"/>
      <ellipse cx="215" cy="205" rx="26" ry="40" fill="#FFFFFF" opacity="0.65" transform="rotate(-18 215 205)"/>
      <ellipse cx="224" cy="278" rx="9" ry="13" fill="#4E342E"/>
      <ellipse cx="288" cy="278" rx="9" ry="13" fill="#4E342E"/>
      <path d="M 238 306 Q 256 322 274 306" fill="none" stroke="#4E342E" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="200" cy="303" rx="15" ry="9" fill="#FFCC80" opacity="0.9"/>
      <ellipse cx="312" cy="303" rx="15" ry="9" fill="#FFCC80" opacity="0.9"/>
    </g>
  </g>
</svg>
